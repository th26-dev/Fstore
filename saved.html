<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FStore - Mục Yêu Thích</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 384 512'><path fill='%23ffffff' d='M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z'/></svg>">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/header.css">
    <link rel="stylesheet" href="./assets/css/product.css"> <link rel="stylesheet" href="./assets/css/saved.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background-color: #f5f5f7;">

    <header class="liquid-header scrolled">
        <nav class="nav-container">
            <ul class="nav-list" id="mainNavList"></ul>
        </nav>
        <div class="search-bar-container" id="searchBarContainer">
            <i class="fa-solid fa-magnifying-glass search-icon-input"></i>
            <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm...">
            <i class="fa-solid fa-xmark close-search" id="closeSearchBtn"></i>
        </div>
        <div class="dropdown-mega-menu" id="megaMenu">
            <div class="dropdown-content" id="dropdownContent"></div>
        </div>
    </header>

    <div id="pageOverlay" class="page-overlay"></div>

    <main class="saved-main-container">
        <h1 class="saved-page-title">Mục yêu thích</h1>
        <p class="saved-page-subtitle">Những sản phẩm bạn yêu thích và muốn xem lại.</p>

        <div id="savedGrid" class="saved-grid">
            <div style="text-align: center; padding: 50px; color: #86868b; grid-column: 1/-1;">Đang tải dữ liệu...</div>
        </div>
    </main>

    <div id="productPopover" class="popover-container">
        <div class="popover-content">
            <i class="fa-solid fa-xmark close-popover" id="closePopoverBtn"></i>
            <div class="popover-grid">
                <div class="popover-image-col" style="position: relative; display: flex; flex-direction: column; align-items: center;">
                    <img src="" id="popoverImg" alt="" style="cursor: pointer;">
                    <div id="imageDots" class="carousel-dots"></div>
                </div>
                <div class="popover-info-col">
                    <h2 id="popoverName"></h2>
                    <p class="popover-desc" id="popoverDesc"></p>
                    <div class="popover-specs" id="popoverSpecs"></div>
                    <h3 class="popover-price" id="popoverPrice"></h3>
                    <div class="popover-variants" id="popoverVariants"></div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn-add-cart" id="addToCartBtn" style="flex: 1;">Thêm vào giỏ hàng</button>
                        <button class="btn-save-item" id="saveItemBtn" style="width: 54px; border-radius: 12px; border: 1px solid #d2d2d7; background: #fff; cursor: pointer; font-size: 20px; color: #1d1d1f; transition: 0.3s;" title="Lưu sản phẩm này">
                            <i class="fa-regular fa-heart"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toastNotification" class="toast-notification">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toastMessage"></span>
    </div>

    <script type="module" src="./controllers/headerController.js"></script>
    <script type="module" src="./controllers/savedController.js"></script>
</body>
</html>
