<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - FStore</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/header.css">
    <link rel="stylesheet" href="./assets/css/cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="liquid-header">
        <nav class="nav-container">
            <ul class="nav-list" id="mainNavList"></ul>
        </nav>

        <div class="search-bar-container" id="searchBarContainer">
            <i class="fa-solid fa-magnifying-glass search-icon-input"></i>
            <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm... (Nhấn Enter để tìm)">
            <i class="fa-solid fa-xmark close-search" id="closeSearchBtn"></i>
        </div>

        <div class="dropdown-mega-menu" id="megaMenu">
            <div class="dropdown-content" id="dropdownContent"></div>
        </div>
    </header>

    <div id="pageOverlay" class="page-overlay"></div>

    <main class="cart-container">
        <p class="cart-notice text-center">Xin lưu ý rằng chúng tôi không chấp nhận đổi trả đối với các đơn hàng trực tuyến.</p>

        <div id="emptyCartView" class="empty-cart-view text-center" style="display: none;">
            <h1 class="apple-title">Giỏ hàng của bạn đang trống.</h1>
            <p class="apple-subtitle">Hưởng miễn phí vận chuyển cho mọi đơn hàng.</p>
            <a href="index.html" class="btn-outline">Tiếp Tục Mua Sắm</a>
        </div>

        <div id="filledCartView" class="filled-cart-view" style="display: none;">
            <div class="cart-header text-center">
                <h1 class="apple-title">Tổng giá trị giỏ hàng của bạn là <span id="totalPrice">0 đ</span>.</h1>
                <p class="apple-subtitle">Vận chuyển miễn phí đối với mọi đơn hàng.</p>
                
                <button class="btn-primary" id="checkoutBtn">Thanh Toán</button>
                <p id="checkoutMsg" style="color: #ff3b30; margin-top: 15px; display: none; text-align: center; font-size: 14px;"></p>

                <div class="payment-methods-apple">
                    <label class="payment-label">
                        <input type="radio" name="payment" value="momo" checked>
                        <span>Ví MoMo</span>
                    </label>
                    <label class="payment-label">
                        <input type="radio" name="payment" value="vnpay">
                        <span>VNPay</span>
                    </label>
                </div>
            </div>

            <div class="cart-items-list" id="cartItems">
                </div>
        </div>
    </main>

    <script type="module" src="./controllers/headerController.js"></script>
    <script type="module" src="./controllers/cartController.js"></script>
</body>
</html>
