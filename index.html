<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FStore - Cửa Hàng Điện Tử</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/header.css">
    <link rel="stylesheet" href="./assets/css/home.css">
    <link rel="stylesheet" href="./assets/css/product.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="liquid-header">
        <nav class="nav-container">
            <ul class="nav-list" id="mainNavList"></ul>
        </nav>

        <div class="search-bar-container" id="searchBarContainer">
            <i class="fa-solid fa-magnifying-glass search-icon-input"></i>
            <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm... (Nhấn Enter để tìm)">
            <i class="fa-solid fa-xmark close-search" id="closeSearchBtn"></i>
        </div>

        <div class="dropdown-mega-menu" id="megaMenu">
            <div class="dropdown-content" id="dropdownContent"></div>
        </div>
    </header>

    <div id="pageOverlay" class="page-overlay"></div>

    <div id="landingPage" class="landing-page-container dark-theme">
        
        <section class="landing-section scroll-anim slide-up" style="padding-top: 60px;">
            <h1 class="landing-title">Galaxy S26 Ultra</h1>
            <p class="landing-subtitle">Kỷ nguyên AI mới. Quyền năng đột phá.</p>
            
            <div class="ambilight-wrapper">
                <video autoplay muted loop playsinline class="ambilight-glow">
                    <source src="./assets/media/Privacy Display _ Galaxy S26 Ultra _ Samsung - (1080p).mp4" type="video/mp4">
                </video>
                <video autoplay muted loop playsinline class="landing-media">
                    <source src="./assets/media/Privacy Display _ Galaxy S26 Ultra _ Samsung - (1080p).mp4" type="video/mp4">
                </video>
            </div>
        </section>

        <section class="landing-section scroll-anim slide-up" style="margin-top: 100px; padding: 80px 20px;">
            <div class="split-container">
                
                <div class="split-text">
                    <h2>Thiết kế titan.<br>Tuyệt đẹp.</h2>
                    <p>Mạnh mẽ hơn. Nhẹ nhàng hơn. Đẳng cấp hơn bao giờ hết. Khung viền titan mới mang lại độ bền vượt trội và cảm giác cầm nắm hoàn hảo, giúp bạn tự tin tỏa sáng mọi lúc mọi nơi.</p>
                </div>

                <div class="split-media">
                    <div class="ambilight-wrapper">
                        <video autoplay muted loop playsinline class="ambilight-glow">
                            <source src="./assets/media/galaxy-s26-features-design-intro.mp4" type="video/mp4">
                        </video>
                        <video autoplay muted loop playsinline class="landing-media">
                            <source src="./assets/media/galaxy-s26-features-design-intro.mp4" type="video/mp4">
                        </video>
                    </div>
                </div>

            </div>
        </section>
        
    </div>

    <main class="main-content" id="mainContent" style="display: none; padding-top: 80px;">
        <div class="product-section">
            <h2 id="sectionTitle" style="display: none;">Danh sách sản phẩm</h2>
            <div class="product-grid" id="productGrid"></div>
        </div>
    </main>

    <div id="productPopover" class="popover-container">
        <div class="popover-content">
            <i class="fa-solid fa-xmark close-popover" id="closePopoverBtn"></i>
            <div class="popover-grid">
                <div class="popover-image-col" style="position: relative; display: flex; flex-direction: column; align-items: center;">
                    <img src="" id="popoverImg" alt="" style="cursor: pointer;">
                    <div id="imageDots" class="carousel-dots"></div>
                </div>
                <div class="popover-info-col">
                    <h2 id="popoverName"></h2>
                    <p class="popover-desc" id="popoverDesc"></p>
                    <div class="popover-specs" id="popoverSpecs"></div>
                    <h3 class="popover-price" id="popoverPrice"></h3>
                    <div class="popover-variants" id="popoverVariants"></div>
                    <button class="btn-add-cart" id="addToCartBtn">Thêm vào giỏ hàng</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./controllers/headerController.js"></script>
    <script type="module" src="./controllers/productController.js"></script>
</body>
</html>
