<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FStore - Cộng đồng & Hỏi đáp</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 384 512'><path fill='%23ffffff' d='M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z'/></svg>">
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/header.css">
    <link rel="stylesheet" href="./assets/css/forum.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="liquid-header">
        <nav class="nav-container">
            <ul class="nav-list" id="mainNavList"></ul>
        </nav>
        <div class="search-bar-container" id="searchBarContainer">
            <i class="fa-solid fa-magnifying-glass search-icon-input"></i>
            <input type="text" id="searchInput" placeholder="Tìm kiếm sản phẩm... (Nhấn Enter để tìm)">
            <i class="fa-solid fa-xmark close-search" id="closeSearchBtn"></i>
        </div>
        <div class="dropdown-mega-menu" id="megaMenu">
            <div class="dropdown-content" id="dropdownContent"></div>
        </div>
    </header>
    <div id="pageOverlay" class="page-overlay"></div>

    <main class="forum-container">
        <div class="forum-hero text-center">
            <h1 class="apple-title">Hỏi đáp & Cộng đồng</h1>
            <p class="apple-subtitle">Nơi giải đáp mọi thắc mắc của bạn về sản phẩm và dịch vụ tại FStore.</p>
        </div>

        <div class="ask-box" id="askBox">
            <div id="unauthMessage" class="text-center" style="display: none;">
                <p>Bạn cần đăng nhập để đặt câu hỏi cho FStore.</p>
                <a href="auth.html" class="btn-outline" style="margin-top: 10px;">Đăng nhập ngay</a>
            </div>
            
            <form id="questionForm" style="display: none;">
                <div class="user-badge">
                    <i class="fa-solid fa-circle-user"></i>
                    <span id="currentUserEmail">Đang tải...</span>
                </div>
                <textarea id="questionInput" placeholder="Bạn có thắc mắc gì về sản phẩm, chính sách bảo hành...?" required rows="3"></textarea>
                <div class="ask-actions">
                    <p class="guideline">* Câu hỏi của bạn sẽ được Admin trả lời trong thời gian sớm nhất.</p>
                    <button type="submit" class="btn-primary" id="btnSubmitQuestion">Gửi câu hỏi</button>
                </div>
            </form>
        </div>

        <div class="posts-list" id="postsList">
            <p class="text-center" style="color: #86868b; margin-top: 40px;">Đang tải dữ liệu diễn đàn...</p>
        </div>
    </main>

    <script type="module" src="./controllers/headerController.js"></script>
    <script type="module" src="./controllers/forumController.js"></script>
    <div id="footer-placeholder"></div>

    <script src="./controllers/loadComponents.js"></script>
</body>
</html>
