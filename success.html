<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thanh toán thành công</title>
    
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .success-box { text-align: center; margin-top: 150px; }
        .success-box i { font-size: 80px; color: #34c759; margin-bottom: 20px; }
        .btn-home { display: inline-block; margin-top: 30px; padding: 12px 25px; background: #0071e3; color: #fff; border-radius: 20px; text-decoration: none; }
        #loadingMsg { color: #86868b; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="success-box">
        <i class="fa-solid fa-circle-check" id="statusIcon"></i>
        <h1 id="statusTitle">Đang xử lý đơn hàng...</h1>
        <p id="statusDesc">Vui lòng không đóng trình duyệt, hệ thống đang cập nhật giao dịch của bạn.</p>
        <p id="loadingMsg"><i class="fa-solid fa-spinner fa-spin"></i> Đang đồng bộ dữ liệu...</p>
        
        <div style="margin-top: 20px;">
            <a href="index.html" class="btn-home" id="btnHome" style="display: none;">Quay về trang chủ</a>
            <a href="orders.html" class="btn-home" id="btnOrders" style="display: none; background: #f5f5f7; color: #1d1d1f; margin-left: 10px;">Xem đơn hàng</a>
        </div>
    </div>

    <script type="module">
        import { db, auth } from './models/firebaseConfig.js';
        import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const resultCode = urlParams.get('resultCode'); 
            
            // LẤY ĐÚNG MÃ TỪ TRÊN THANH URL CỦA MOMO TRẢ VỀ
            const orderId = urlParams.get('orderId');

            const statusTitle = document.getElementById('statusTitle');
            const statusDesc = document.getElementById('statusDesc');
            const statusIcon = document.getElementById('statusIcon');
            const loadingMsg = document.getElementById('loadingMsg');
            const btnHome = document.getElementById('btnHome');
            const btnOrders = document.getElementById('btnOrders');

            if (!orderId) {
                statusIcon.className = "fa-solid fa-circle-question";
                statusIcon.style.color = "#86868b";
                statusTitle.innerText = "Không tìm thấy mã đơn hàng!";
                statusDesc.innerText = "Giao dịch không hợp lệ hoặc không có mã trả về từ MoMo.";
                loadingMsg.style.display = "none";
                btnHome.style.display = "inline-block";
                return;
            }

            // Đợi xác thực Firebase xong mới cập nhật
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const orderRef = doc(db, "orders", orderId);
                    try {
                        if (resultCode === "0") {
                            await updateDoc(orderRef, { status: "Đã thanh toán" });
                            
                            statusIcon.className = "fa-solid fa-circle-check";
                            statusIcon.style.color = "#34c759";
                            statusTitle.innerText = "Cảm ơn bạn đã đặt hàng!";
                            statusDesc.innerText = `Giao dịch đơn hàng của bạn đã được xử lý thành công.`;
                        } else {
                            await updateDoc(orderRef, { status: "Đã hủy" });
                            
                            statusIcon.className = "fa-solid fa-circle-xmark";
                            statusIcon.style.color = "#ff3b30";
                            statusTitle.innerText = "Thanh toán thất bại hoặc đã bị hủy!";
                            statusDesc.innerText = "Giao dịch không thành công, đơn hàng của bạn đã bị hủy.";
                        }
                    } catch (error) {
                        console.error("LỖI CẬP NHẬT FIREBASE:", error);
                        statusIcon.className = "fa-solid fa-triangle-exclamation";
                        statusIcon.style.color = "#f59e0b";
                        statusTitle.innerText = "Đã nhận tiền nhưng lỗi đồng bộ!";
                        statusDesc.innerText = "Nhấn F12 mở tab Console để xem lỗi. Thường do Rules của Firebase hoặc Adblock chặn update.";
                    }
                } else {
                    statusIcon.className = "fa-solid fa-circle-xmark";
                    statusIcon.style.color = "#ff3b30";
                    statusTitle.innerText = "Phiên đăng nhập hết hạn!";
                    statusDesc.innerText = "Hệ thống không nhận diện được tài khoản của bạn để lưu đơn hàng.";
                }

                loadingMsg.style.display = "none";
                btnHome.style.display = "inline-block";
                btnOrders.style.display = "inline-block";
            });
        });
    </script>
</body>
</html>
